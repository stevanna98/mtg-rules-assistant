[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-rules-assistant"
version = "0.1.0"
description = "MTG Rules Assistant powered by Claude and Scryfall"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.18.0",
    "groq>=1.2.0",
    "sentence-transformers>=5.4.1",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_rules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.4.0",
]
