[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-rules-assistant"
version = "0.1.0"
description = "MTG Rules Assistant powered by Claude and Scryfall"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "anthropic>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_rules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.workspace]
members = [
    "mtg-rules-assistant",
]

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
]
