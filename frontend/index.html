<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTG Judge">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>MTG Judge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --accent: #e94560;
      --text: #e0e0e0;
      --muted: #888;
      --deep: #0f1923;
      --radius: 18px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      /* 100dvh accounts for iOS Safari dynamic toolbar */
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-title { display: flex; flex-direction: column; gap: 2px; }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
    header p  { font-size: 12px; color: var(--muted); }

    #clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #clear-btn:active { background: var(--border); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h2   { font-size: 17px; color: var(--text); margin-bottom: 8px; }
    .empty-state p    { font-size: 14px; line-height: 1.5; }

    /* Message rows */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      gap: 6px;
    }
    .msg.user      { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    /* Attached image thumbnail */
    .thumb {
      max-width: 180px;
      max-height: 180px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    /* Text bubble */
    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Loading dots animation */
    .loading .bubble { color: var(--muted); font-style: italic; }
    @keyframes ellipsis {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
      100% { content: ''; }
    }
    .loading .bubble::after {
      content: '';
      animation: ellipsis 1.2s steps(1, end) infinite;
    }

    /* ── Card pills ── */
    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-pill {
      background: var(--border);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
    }

    /* ── Rules accordion ── */
    .rules-section { width: 100%; }
    .rules-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .rules-toggle .chevron { transition: transform 0.2s; display: inline-block; }
    .rules-toggle.open .chevron { transform: rotate(90deg); }

    .rules-list {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--deep);
      border-radius: 10px;
      border-left: 3px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .rules-list.open { display: flex; }

    .rule-item {}
    .rule-num  { font-weight: 700; color: var(--accent); font-size: 12px; margin-bottom: 3px; }
    .rule-text { font-size: 12px; color: #aaa; line-height: 1.5; }

    /* ── Image preview strip ── */
    #image-preview {
      display: none;
      flex-shrink: 0;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #image-preview.visible { display: flex; }
    #preview-img { height: 56px; width: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    #remove-image {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    #preview-label { font-size: 12px; color: var(--muted); flex: 1; }

    /* ── Input area ── */
    #input-area {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    /* Camera button — use a <label> to trigger the hidden file input */
    #camera-label {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--border);
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 20px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #camera-label:active { background: #1a3a60; }
    #image-input { display: none; }

    #question {
      flex: 1;
      background: var(--deep);
      border: 1px solid var(--border);
      border-radius: 21px;
      padding: 10px 16px;
      color: var(--text);
      /* 16px prevents iOS auto-zoom on focus */
      font-size: 16px;
      line-height: 1.4;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 120px;
      overflow-y: auto;
    }
    #question::placeholder { color: #4a4a6a; }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn:active:not(:disabled) { background: #c73550; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>MTG Judge</h1>
      <p>Rules questions &amp; card lookup</p>
    </div>
    <button id="clear-btn" title="Start new conversation">New chat</button>
  </header>

  <div id="messages">
    <div class="empty-state">
      <div class="icon">⚖️</div>
      <h2>Ask the Judge</h2>
      <p>Type a rules question below.<br>Attach a card photo for instant identification.</p>
    </div>
  </div>

  <div id="image-preview">
    <img id="preview-img" src="" alt="Attached image">
    <span id="preview-label">Card photo attached</span>
    <button id="remove-image" title="Remove image">✕</button>
  </div>

  <div id="input-area">
    <label id="camera-label" for="image-input" title="Attach card photo">📷</label>
    <input type="file" id="image-input" accept="image/*" capture="environment">
    <textarea id="question" rows="1" placeholder="Ask a rules question…"></textarea>
    <button id="send-btn" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <script>
    const messagesEl  = document.getElementById('messages');
    const questionEl  = document.getElementById('question');
    const sendBtn     = document.getElementById('send-btn');
    const imageInput  = document.getElementById('image-input');
    const previewEl   = document.getElementById('image-preview');
    const previewImg  = document.getElementById('preview-img');
    const removeImg   = document.getElementById('remove-image');
    const clearBtn    = document.getElementById('clear-btn');

    let history = [];       // [{role, content}, ...]
    let pendingImage = null;
    let isLoading = false;

    // ── Textarea auto-resize ──────────────────────────────────────────────────
    questionEl.addEventListener('input', resizeTextarea);
    function resizeTextarea() {
      questionEl.style.height = 'auto';
      questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + 'px';
    }

    // Send on Enter (Shift+Enter for newline)
    questionEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);

    // ── Image attachment ──────────────────────────────────────────────────────
    imageInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      pendingImage = file;
      previewImg.src = URL.createObjectURL(file);
      previewEl.classList.add('visible');
    });

    removeImg.addEventListener('click', clearImage);
    function clearImage() {
      pendingImage = null;
      imageInput.value = '';
      previewImg.src = '';
      previewEl.classList.remove('visible');
    }

    // ── Clear conversation ────────────────────────────────────────────────────
    clearBtn.addEventListener('click', () => {
      history = [];
      clearImage();
      messagesEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚖️</div>
          <h2>Ask the Judge</h2>
          <p>Type a rules question below.<br>Attach a card photo for instant identification.</p>
        </div>`;
    });

    // ── Scroll helper ─────────────────────────────────────────────────────────
    function scrollBottom() {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    }

    // ── Remove empty state on first message ───────────────────────────────────
    function clearEmptyState() {
      const es = messagesEl.querySelector('.empty-state');
      if (es) es.remove();
    }

    // ── Append a plain user or error bubble ──────────────────────────────────
    function appendBubble(role, text, imageObjectUrl = null) {
      clearEmptyState();
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;

      if (imageObjectUrl) {
        const img = document.createElement('img');
        img.src = imageObjectUrl;
        img.className = 'thumb';
        msg.appendChild(img);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      scrollBottom();
      return msg;
    }

    // ── Append the structured assistant response ──────────────────────────────
    function appendAssistant(data) {
      clearEmptyState();
      const msg = document.createElement('div');
      msg.className = 'msg assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = data.answer;
      msg.appendChild(bubble);

      // Card pills
      if (data.cards && data.cards.length > 0) {
        const row = document.createElement('div');
        row.className = 'cards-row';
        data.cards.forEach(c => {
          const pill = document.createElement('span');
          pill.className = 'card-pill';
          pill.textContent = c.name;
          row.appendChild(pill);
        });
        msg.appendChild(row);
      }

      // Rules accordion
      if (data.rules && data.rules.length > 0) {
        const section = document.createElement('div');
        section.className = 'rules-section';

        const n = data.rules.length;
        const toggle = document.createElement('div');
        toggle.className = 'rules-toggle';
        toggle.innerHTML = `<span class="chevron">▶</span> ${n} rule${n > 1 ? 's' : ''} cited`;
        section.appendChild(toggle);

        const list = document.createElement('div');
        list.className = 'rules-list';
        data.rules.forEach(r => {
          const item = document.createElement('div');
          item.className = 'rule-item';
          item.innerHTML = `<div class="rule-num">Rule ${escHtml(r.rule_number)}</div>`
                         + `<div class="rule-text">${escHtml(r.raw_text)}</div>`;
          list.appendChild(item);
        });
        section.appendChild(list);

        toggle.addEventListener('click', () => {
          const open = list.classList.toggle('open');
          toggle.classList.toggle('open', open);
          toggle.innerHTML = `<span class="chevron">▶</span> ${n} rule${n > 1 ? 's' : ''} cited`;
        });

        msg.appendChild(section);
      }

      messagesEl.appendChild(msg);
      scrollBottom();
    }

    // ── Escape HTML to prevent XSS from API content ───────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Loading state ─────────────────────────────────────────────────────────
    function setLoading(on) {
      isLoading = on;
      sendBtn.disabled = on;
      questionEl.disabled = on;
    }

    // ── Send ──────────────────────────────────────────────────────────────────
    async function send() {
      const question = questionEl.value.trim();
      if (!question || isLoading) return;

      // Snapshot and clear inputs immediately
      const imgFile    = pendingImage;
      const imgPreview = imgFile ? previewImg.src : null;
      questionEl.value = '';
      resizeTextarea();
      clearImage();
      setLoading(true);

      appendBubble('user', question, imgPreview);

      // Loading indicator
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'msg assistant loading';
      loadingMsg.innerHTML = '<div class="bubble">Judging</div>';
      messagesEl.appendChild(loadingMsg);
      scrollBottom();

      try {
        let data;

        if (imgFile) {
          const form = new FormData();
          form.append('question', question);
          form.append('top_k', '5');
          form.append('history', JSON.stringify(history));
          form.append('image', imgFile);
          const res = await fetch('/ask/image', { method: 'POST', body: form });
          if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
          data = await res.json();
        } else {
          const res = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, top_k: 5, history }),
          });
          if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
          data = await res.json();
        }

        loadingMsg.remove();
        appendAssistant(data);

        // Append to conversation history (text only — no RAG context in history)
        history.push({ role: 'user',      content: question      });
        history.push({ role: 'assistant', content: data.answer   });

      } catch (err) {
        loadingMsg.remove();
        appendBubble('assistant', `Error: ${err.message}`);
      } finally {
        setLoading(false);
        questionEl.focus();
      }
    }

    // ── Service worker registration ───────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
